<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>질문 관리 - DevlogQnA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/board.css">
  <meta name="isAdmin" th:content="${isAdmin}">
</head>
<body class="bg-light">
<nav class="apple-nav">
  <div class="apple-nav-inner">
    <a class="apple-brand" href="/">💬 DevlogQnA</a>
    <div class="apple-nav-links">
      <a href="/">질문 목록</a>
      <a href="/questions/new">질문 등록</a>
      <span sec:authorize="isAuthenticated()">
                    <a href="/admin/dashboard" class="apple-btn-secondary">관리페이지</a>
                    <a href="/admin/logout" class="apple-btn-secondary">로그아웃</a>
                </span>
    </div>
  </div>
</nav>

<div class="container main-content">
  <div class="apple-section">
    <h2 class="apple-heading">질문 관리</h2>
    <div class="mb-3">
      <button id="deleteSelectedBtn" class="apple-btn-danger">선택 삭제</button>
    </div>
    <table class="apple-table">
      <thead>
      <tr>
        <th><input type="checkbox" id="selectAllCheckbox" title="전체 선택"></th>
        <th>ID</th>
        <th>제목</th>
        <th>작성자</th>
        <th>비밀글</th>
        <th>상태</th>
        <th>좋아요</th>
        <th>관리</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="q : ${questions.content}">
        <td><input type="checkbox" class="question-checkbox" th:value="${q.id}"></td>
        <td th:text="${q.id}">1</td>
        <td><a th:href="@{/questions/{id}(id=${q.id})}" th:text="${q.title}" class="text-decoration-none"></a></td>
        <td th:text="${q.authorEmail}">email</td>
        <td>
          <span th:if="${q.isSecret}" class="text-warning" title="비밀글">🔒</span>
          <span th:unless="${q.isSecret}" class="text-muted">일반</span>
        </td>
        <td>
          <span class="status-badge" th:classappend="'status-' + ${q.status.name().toLowerCase()}" th:text="${q.status}">OPEN</span>
        </td>
        <td th:text="${q.likeCount}">0</td>
        <td>
          <a th:href="@{/admin/questions/{id}(id=${q.id})}" class="apple-btn-secondary-sm">답변</a>
          <button class="apple-btn-danger-sm delete-single-btn" th:data-question-id="${q.id}">삭제</button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var selectAllCheckbox = document.getElementById('selectAllCheckbox');
        var questionCheckboxes = document.querySelectorAll('.question-checkbox');
        if (selectAllCheckbox) {
            selectAllCheckbox.addEventListener('change', function() {
                questionCheckboxes.forEach(function(cb) { cb.checked = this.checked; }.bind(this));
            });
        }
        var deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
        if (deleteSelectedBtn) {
            deleteSelectedBtn.addEventListener('click', function() {
                var selectedIds = [];
                questionCheckboxes.forEach(function(cb) { if (cb.checked) selectedIds.push(cb.value); });
                if (selectedIds.length === 0) { alert('삭제할 질문을 선택해주세요.'); return; }
                if (!confirm('선택한 ' + selectedIds.length + '개의 질문을 정말 삭제하시겠습니까?')) return;
                fetch('/admin/questions?ids=' + encodeURIComponent(selectedIds.join(',')), { method: 'DELETE' })
                    .then(function(res) { if (res.ok) location.reload(); else alert('삭제에 실패했습니다.'); });
            });
        }
        document.querySelectorAll('.delete-single-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var questionId = this.getAttribute('data-question-id');
                if (!confirm('정말 삭제하시겠습니까?')) return;
                fetch('/admin/questions/' + questionId, { method: 'DELETE' })
                    .then(function(res) { if (res.ok) location.reload(); else alert('삭제에 실패했습니다.'); });
            });
        });
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
