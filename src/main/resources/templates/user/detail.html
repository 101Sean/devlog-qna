<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>질문 상세 - DevlogQnA</title>
  <!-- Bootstrap + Icons (layout.html과 동일) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- 커스텀 CSS -->
  <link rel="stylesheet" href="/css/board.css">
  <!-- isAdmin 값 전달 -->
  <meta name="isAdmin" th:content="${isAdmin}">
</head>
<body class="bg-light" th:data-question-id="${question.id}">

<!-- ===== 네비게이션 바 (layout.html과 동일) ===== -->
<nav class="apple-nav">
  <div class="apple-nav-inner">
    <a class="apple-brand" href="/">💬 DevlogQnA</a>
    <div class="apple-nav-links">
      <a href="/">질문 목록</a>
      <a href="/questions/new">질문 등록</a>
      <!-- 로그인하지 않은 경우 -->
      <span sec:authorize="!isAuthenticated()">
                    <a href="/admin/login" class="apple-btn-secondary">로그인</a>
                </span>
      <!-- 로그인한 경우 -->
      <span sec:authorize="isAuthenticated()">
                    <a href="/admin/dashboard" class="apple-btn-secondary">관리페이지</a>
                    <a href="/admin/logout" class="apple-btn-secondary">로그아웃</a>
                </span>
    </div>
  </div>
</nav>

<div class="container main-content">
  <!-- ========== 질문 본문 ========== -->
  <div class="apple-card detail-card">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <h2 class="apple-card-title" th:text="${question.title}"></h2>
      <button id="deleteQuestionBtn" class="apple-btn-danger">🗑️ 삭제</button>
    </div>

    <p class="apple-card-text" th:text="${question.content}"></p>

    <div class="detail-meta">
      <span th:each="tag : ${question.tags}" class="tag-badge" th:text="${tag}"></span>
      <span th:text="${#temporals.format(question.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
    </div>

    <!-- 좋아요 + 조회수 -->
    <div class="d-flex align-items-center gap-2 mt-3 detail-actions">
      <button id="likeBtn" class="detail-action-btn" title="좋아요">
        <i class="bi bi-heart-fill"></i> <span id="likeCount">0</span>
      </button>
      <span>
        <i class="bi bi-eye"></i> <span th:text="${question.viewCount}">0</span>
      </span>
    </div>

    <!-- 관리자 답변 (있을 경우만) -->
    <div th:if="${not #lists.isEmpty(answers)}" class="answer-section mt-3 pt-3 border-top">
      <h4 class="apple-subheading">📌 관리자 답변</h4>
      <div th:each="answer : ${answers}" class="answer-item d-flex justify-content-between align-items-start">
        <div>
          <p th:text="${answer.content}"></p>
          <small class="text-muted" th:text="${#temporals.format(answer.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
        </div>
        <button class="apple-btn-danger delete-answer-btn" th:data-answer-id="${answer.id}" title="답변 삭제">🗑️</button>
      </div>
    </div>

    <!-- 관리자 전용: 답변 작성/수정 폼 -->
    <div sec:authorize="hasRole('ADMIN')" class="mt-3 pt-3 border-top">
      <th:block th:if="${#lists.isEmpty(answers)}">
        <h5>답변 등록</h5>
        <form id="adminAnswerForm">
          <textarea id="answerContent" class="apple-input" rows="3" placeholder="답변을 입력하세요" required></textarea>
          <button type="submit" class="apple-btn-primary mt-2">답변 등록</button>
        </form>
      </th:block>
      <th:block th:unless="${#lists.isEmpty(answers)}">
        <h5>답변 수정</h5>
        <th:block th:each="answer : ${answers}">
          <form class="adminAnswerEditForm" th:data-answer-id="${answer.id}">
            <textarea class="apple-input edit-answer-content" rows="3" th:text="${answer.content}"></textarea>
            <button type="submit" class="apple-btn-primary mt-2">답변 수정</button>
          </form>
        </th:block>
      </th:block>
    </div>
  </div>

  <!-- ========== 댓글 영역 ========== -->
  <div class="apple-card comment-section">
    <h4 class="apple-subheading">💬 댓글 (<span th:text="${#lists.size(comments)}">0</span>)</h4>
    <div class="comment-list">
      <div th:each="comment : ${comments}" class="comment-item">
        <div class="comment-body">
          <strong th:text="${comment.authorName}"></strong>
          <p th:text="${comment.content}" class="mb-1"></p>
          <span class="comment-meta" th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
        </div>
        <button class="apple-btn-danger delete-comment-btn" th:data-comment-id="${comment.id}" title="댓글 삭제">🗑️</button>
      </div>
      <div th:if="${#lists.isEmpty(comments)}" class="text-muted py-3">아직 댓글이 없습니다.</div>
    </div>

    <div class="comment-form mt-3 pt-3 border-top">
      <h5>댓글 작성</h5>
      <form th:action="@{/questions/{id}/comments/new(id=${question.id})}" method="post" th:object="${commentRequest}">
        <div class="row g-2" sec:authorize="!hasRole('ADMIN')">
          <div class="col-md-4"><input type="text" th:field="*{authorName}" class="apple-input" placeholder="이름" required></div>
          <div class="col-md-4"><input type="email" th:field="*{authorEmail}" class="apple-input" placeholder="이메일" required></div>
          <div class="col-md-4"><input type="password" th:field="*{password}" class="apple-input" placeholder="비밀번호" required></div>
        </div>
        <textarea th:field="*{content}" class="apple-input mt-2" rows="3" placeholder="댓글 내용" required></textarea>
        <button type="submit" class="apple-btn-primary mt-2">등록</button>
      </form>
    </div>
  </div>
</div>

<script>
    var questionId = document.body.getAttribute('data-question-id') || 0;
    var isAdmin = document.querySelector('meta[name="isAdmin"]')?.content === 'true';

    var savedEmail = localStorage.getItem('devlog_email');
    if (savedEmail) {
        var emailInput = document.querySelector('input[name="authorEmail"]');
        if (emailInput) emailInput.value = savedEmail;
    }

    // 댓글 폼 제출 시 이메일 저장
    var commentForm = document.querySelector('.comment-form form');
    if (commentForm) {
        commentForm.addEventListener('submit', function() {
            var emailInput = document.querySelector('input[name="authorEmail"]');
            if (emailInput && emailInput.value) {
                localStorage.setItem('devlog_email', emailInput.value);
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        console.log("questionId:", questionId, "isAdmin:", isAdmin);

        // 1. 좋아요 토글
        var likeBtn = document.getElementById('likeBtn');
        if (likeBtn) {
            // 초기 좋아요 개수 로딩
            fetch('/api/questions/' + questionId + '/like/count')
                .then(function(res) { return res.json(); })
                .then(function(data) { document.getElementById('likeCount').textContent = data.likeCount;});

            likeBtn.addEventListener('click', function() {
                var email = localStorage.getItem('devlog_email');

                if (email) {
                    sendLikeRequest(email);
                } else {
                    email = prompt("이메일을 입력해주세요:");
                    if (!email) return;
                    localStorage.setItem('devlog_email', email);
                    sendLikeRequest(email);
                }
            });
        }

        // 좋아요 API 호출 함수 (중복 제거)
        function sendLikeRequest(email) {
            fetch('/api/questions/' + questionId + '/like', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({userEmail: email})
            })
                .then(function(res) { return res.json(); })
                .then(function(data) { document.getElementById('likeCount').textContent = data.likeCount; });
        }

        // 2. 게시글 삭제
        var deleteBtn = document.getElementById('deleteQuestionBtn');
        if (deleteBtn) {
            deleteBtn.addEventListener('click', function() {
                if (isAdmin) {
                    if (!confirm('정말 삭제하시겠습니까?')) return;
                    fetch('/admin/questions/' + questionId, { method: 'DELETE', credentials: 'same-origin' })
                        .then(function(res) { if (res.ok) location.href = '/'; else alert('삭제 실패'); });
                } else {
                    var savedEmail = localStorage.getItem('devlog_email');
                    var email = prompt("작성자 이메일을 입력해주세요:", savedEmail || "");
                    if (!email) return;
                    localStorage.setItem('devlog_email', email);

                    var password = prompt("비밀번호를 입력해주세요:");
                    if (!password) return;
                    fetch('/api/questions/' + questionId, {
                        method: 'DELETE',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({authorEmail: email, password: password})
                    })
                        .then(function(res) { if (res.ok) location.href = '/'; else alert('이메일 또는 비밀번호가 올바르지 않습니다.'); });
                }
            });
        }

        // 3. 댓글 삭제
        document.querySelectorAll('.delete-comment-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var commentId = this.getAttribute('data-comment-id');
                if (isAdmin) {
                    if (!confirm('댓글을 삭제하시겠습니까?')) return;
                    fetch('/admin/comments/' + commentId, { method: 'DELETE', credentials: 'same-origin' })
                        .then(function(res) { if (res.ok) location.reload(); else alert('댓글 삭제 실패'); });
                } else {
                    var password = prompt("댓글 작성 시 입력한 비밀번호를 입력해주세요:");
                    if (!password) return;
                    fetch('/api/comments/' + commentId, {
                        method: 'DELETE',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({password: password})
                    })
                        .then(function(res) { if (res.ok) location.reload(); else alert('비밀번호가 올바르지 않습니다.'); });
                }
            });
        });

        // 4. 관리자 답변 등록
        var adminAnswerForm = document.getElementById('adminAnswerForm');
        if (adminAnswerForm) {
            adminAnswerForm.addEventListener('submit', function(e) {
                e.preventDefault();
                var content = document.getElementById('answerContent').value;
                fetch('/admin/questions/' + questionId + '/answer', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'same-origin',
                    body: JSON.stringify({content: content})
                })
                    .then(function(res) {
                        if (res.ok) location.reload();
                        else alert('답변 등록에 실패했습니다.');
                    });
            });
        }

        // 5. 관리자 답변 수정
        document.querySelectorAll('.adminAnswerEditForm').forEach(function(form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                var answerId = this.getAttribute('data-answer-id');
                var content = this.querySelector('.edit-answer-content').value;
                fetch('/admin/answers/' + answerId, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'same-origin',
                    body: JSON.stringify({content: content})
                })
                    .then(function(res) {
                        if (res.ok) location.reload();
                        else alert('답변 수정에 실패했습니다.');
                    });
            });
        });

        // 6. 관리자 답변 삭제 (추가)
        document.querySelectorAll('.delete-answer-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var answerId = this.getAttribute('data-answer-id');
                console.log("답변 삭제 버튼 클릭, answerId:", answerId);
                if (!confirm('답변을 정말 삭제하시겠습니까?')) return;
                fetch('/admin/answers/' + answerId, {
                    method: 'DELETE',
                    credentials: 'same-origin'
                })
                    .then(function(res) {
                        if (res.ok) {
                            location.reload();
                        } else {
                            alert('답변 삭제에 실패했습니다.');
                        }
                    });
            });
        });
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
