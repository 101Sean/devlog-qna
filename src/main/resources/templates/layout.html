<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">

  <title layout:title-pattern="$DECORATOR_TITLE - $CONTENT_TITLE">DevlogQnA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="/css/board.css">
</head>
<body>

<nav class="apple-nav">
  <div class="apple-nav-inner">
    <a class="apple-brand" href="/">💬 DevlogQnA</a>

    <div class="apple-nav-links">
      <a href="/">질문 목록</a>
      <a href="/questions/new">질문 등록</a>

      <!-- 로그인하지 않은 경우: 로그인 버튼 -->
      <span sec:authorize="!isAuthenticated()">
                    <a href="/admin/login" class="apple-btn-secondary">관리자</a>
                </span>

      <!-- 로그인한 경우: 관리페이지 + 로그아웃 -->
      <span sec:authorize="isAuthenticated()">
                    <a href="/admin/dashboard">관리</a>
                    <a href="/admin/logout" class="apple-btn-secondary">로그아웃</a>
                </span>
    </div>
  </div>
</nav>

<main class="main-content" layout:fragment="content">
  <!-- 본문 -->
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
