<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>질문 등록 - DevlogQnA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/board.css">
</head>
<body class="bg-light">
<nav class="apple-nav">
  <div class="apple-nav-inner">
    <a class="apple-brand" href="/">💬 DevlogQnA</a>
    <div class="apple-nav-links">
      <a href="/questions/new">질문 등록</a>
      <a href="/chat">실시간 QnA</a>
      <span sec:authorize="!isAuthenticated()">
                    <a href="/admin/login" class="apple-btn-secondary">로그인</a>
                </span>
      <span sec:authorize="isAuthenticated()">
                    <a href="/admin/dashboard">관리</a>
                    <a href="/admin/logout" class="apple-btn-secondary">로그아웃</a>
                </span>
    </div>
  </div>
</nav>

<div class="container main-content">
  <div class="apple-card" style="max-width: 700px; margin: 0 auto;">
    <h2 class="apple-card-title">질문 등록</h2>
    <form th:action="@{/questions/new}" method="post" th:object="${questionRequest}">
      <input type="text" th:field="*{title}" class="apple-input" placeholder="제목" required>
      <textarea th:field="*{content}" class="apple-input mt-2" rows="5" placeholder="내용" required></textarea>
      <input type="text" th:field="*{tags}" class="apple-input mt-2" placeholder="태그 (쉼표로 구분)">
      <input type="email" th:field="*{authorEmail}" class="apple-input mt-2" placeholder="이메일" required>
      <input type="password" th:field="*{password}" class="apple-input mt-2" placeholder="비밀번호 (수정/삭제 시 필요)" required>
      <div class="d-flex gap-4 mt-2">
        <div class="form-check">
          <input type="checkbox" th:field="*{isSecret}" class="form-check-input" id="secretCheck">
          <label class="form-check-label" for="secretCheck">비밀글</label>
        </div>
        <div class="form-check">
          <input type="checkbox" th:field="*{notifyEmail}" class="form-check-input" id="notifyCheck">
          <label class="form-check-label" for="notifyCheck">이메일 알림 받기</label>
        </div>
      </div>
      <button type="submit" class="apple-btn-primary mt-3">등록</button>
    </form>
  </div>
</div>

<script>
    var savedEmail = localStorage.getItem('devlog_email');
    if (savedEmail) {
        var emailInput = document.querySelector('input[name="authorEmail"]');
        if (emailInput) emailInput.value = savedEmail;
    }
    document.querySelector('form').addEventListener('submit', function() {
        var emailInput = document.querySelector('input[name="authorEmail"]');
        if (emailInput && emailInput.value) {
            localStorage.setItem('devlog_email', emailInput.value);
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
